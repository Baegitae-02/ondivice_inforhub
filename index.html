<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>정보 공유 및 자료실 Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-share-nodes text-2xl text-indigo-200"></i>
                <h1 class="text-xl font-bold tracking-tight">포스코 온디바이스AI ShareHub</h1>
            </div>
            <button onclick="openModal()" class="bg-white text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg font-semibold text-sm transition-colors shadow-sm flex items-center gap-2">
                <i class="fa-solid fa-plus"></i> 자료 올리기
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">
        
        <!-- Search & Filter Bar -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6 flex flex-col md:flex-row gap-4 justify-between items-center">
            <!-- Category Tabs -->
            <div class="flex flex-wrap gap-2 w-full md:w-auto" id="categoryTabs">
                <button onclick="filterCategory('전체')" class="tab-btn active px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white" data-cat="전체">전체</button>
                <button onclick="filterCategory('수업/기술')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200" data-cat="수업/기술">1. 수업 & 기술</button>
                <button onclick="filterCategory('취업/취준')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200" data-cat="취업/취준">2. 취업 & 취준</button>
                <button onclick="filterCategory('자격증/시험')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200" data-cat="자격증/시험">3. 자격증 & 시험</button>
                <button onclick="filterCategory('기타')" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200" data-cat="기타">기타</button>
            </div>

            <!-- Search Input -->
            <div class="relative w-full md:w-72">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="제목, 내용, 작성자 검색..." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
            </div>
        </div>

        <!-- Posts List / Grid -->
        <div id="postsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Post Cards loaded here -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-xl border border-dashed border-slate-300">
            <i class="fa-regular fa-folder-open text-4xl text-slate-300 mb-3"></i>
            <p class="text-slate-500 font-medium">등록된 자료가 없습니다.</p>
            <p class="text-xs text-slate-400 mt-1">첫 번째 자료를 공유해보세요!</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-6 mt-12">
        <div class="max-w-6xl mx-auto px-4 text-center text-xs text-slate-400">
            &copy; 2026 자료 공유 커뮤니티 Hub. HTML, CSS, JavaScript 및 File API 기반으로 동작합니다.
        </div>
    </footer>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg overflow-hidden border border-slate-100 animate-fadeIn max-h-[90vh] flex flex-col">
            <div class="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-file-circle-plus text-indigo-600"></i> 새 자료 등록하기
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form id="postForm" onsubmit="savePost(event)" class="p-6 space-y-4 overflow-y-auto">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">카테고리</label>
                    <select id="postCategory" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <option value="수업/기술">1. 수업 & 기술</option>
                        <option value="취업/취준">2. 취업 & 취준</option>
                        <option value="자격증/시험">3. 자격증 & 시험</option>
                        <option value="기타">기타</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">제목</label>
                    <input type="text" id="postTitle" required placeholder="자료 또는 공유할 정보의 제목" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">작성자 / 닉네임</label>
                    <input type="text" id="postAuthor" required placeholder="이름 또는 닉네임" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">내용 / 설명</label>
                    <textarea id="postContent" rows="3" required placeholder="자료에 대한 상세 설명, 핵심 요약, 참고 사항 등을 적어주세요." class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none resize-none"></textarea>
                </div>

                <!-- File Attachment Field -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">파일 직접 첨부 (선택)</label>
                    <input type="file" id="postFile" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 cursor-pointer border border-slate-200 rounded-lg">
                    <p class="text-[11px] text-slate-400 mt-1">* 문서, 이미지, 압축파일 등을 첨부할 수 있습니다.</p>
                </div>

                <!-- Web Link Field -->
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">참고 URL / 웹 링크 (선택)</label>
                    <input type="url" id="postLink" placeholder="https://drive.google.com/... 또는 관련 링크" class="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div class="pt-2 flex justify-end gap-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-100 transition-colors">취소</button>
                    <button type="submit" class="px-5 py-2 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-700 text-white transition-colors shadow-sm">등록하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Initial Mock Data
        const initialPosts = [
            {
                id: 1,
                category: '수업/기술',
                title: 'ROS2 Humble 기본 개념 정리 및 노드 통신 예제',
                author: '배기태',
                content: '로봇공학 수업 및 실습 시 참고할 수 있는 ROS2 Publisher/Subscriber 개념 요약 노트입니다.',
                link: 'https://docs.ros.org/',
                fileName: '',
                fileData: '',
                date: '2026-08-10'
            },
            {
                id: 2,
                category: '취업/취준',
                title: '2026 하반기 로봇/제어/품질기술 직무 합격 자소서 항목 분석',
                author: '취준승리자',
                content: '생산기술 및 품질보증(QA) 지원 시 자주 나오는 질문과 역량 중심 작성 팁 정리 모음입니다.',
                link: '',
                fileName: '',
                fileData: '',
                date: '2026-08-11'
            },
            {
                id: 3,
                category: '자격증/시험',
                title: '임베디드 기사 / 일반기계기사 필기 핵심 기출 요약집',
                author: '열공러',
                content: '시험 전 최종 점검용 요약본입니다. 주요 공식과 자주 틀리는 문제 위주로 정리되어 있습니다.',
                link: '',
                fileName: '',
                fileData: '',
                date: '2026-08-12'
            }
        ];

        let currentCategory = '전체';
        let searchQuery = '';

        function getPosts() {
            const stored = localStorage.getItem('info_community_posts');
            if (!stored) {
                localStorage.setItem('info_community_posts', JSON.stringify(initialPosts));
                return initialPosts;
            }
            return JSON.parse(stored);
        }

        function renderPosts() {
            const posts = getPosts();
            const container = document.getElementById('postsContainer');
            const emptyState = document.getElementById('emptyState');

            const filtered = posts.filter(p => {
                const matchCategory = currentCategory === '전체' || p.category === currentCategory;
                const matchSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    p.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                    p.author.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            container.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(p => {
                const badgeColor = getCategoryBadgeColor(p.category);
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col justify-between hover:shadow-md transition-shadow relative group';
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 rounded-full ${badgeColor}">
                                ${p.category}
                            </span>
                            <button onclick="deletePost(${p.id})" class="text-slate-300 hover:text-rose-500 text-xs transition-colors p-1" title="삭제">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                        <h3 class="font-bold text-slate-800 text-base mb-2 line-clamp-2 leading-snug group-hover:text-indigo-600 transition-colors">
                            ${escapeHtml(p.title)}
                        </h3>
                        <p class="text-slate-600 text-sm mb-4 line-clamp-3 leading-relaxed whitespace-pre-line">
                            ${escapeHtml(p.content)}
                        </p>
                    </div>

                    <div>
                        ${p.fileName && p.fileData ? `
                            <div class="mb-3 p-2.5 bg-slate-50 border border-slate-200 rounded-lg flex items-center justify-between text-xs">
                                <div class="flex items-center gap-2 truncate">
                                    <i class="fa-solid fa-paperclip text-slate-400"></i>
                                    <span class="font-medium text-slate-700 truncate" title="${escapeHtml(p.fileName)}">${escapeHtml(p.fileName)}</span>
                                </div>
                                <a href="${p.fileData}" download="${escapeHtml(p.fileName)}" class="text-indigo-600 hover:text-indigo-800 font-bold ml-2 shrink-0 flex items-center gap-1">
                                    <i class="fa-solid fa-download"></i> 다운로드
                                </a>
                            </div>
                        ` : ''}

                        <div class="pt-3 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                            <div class="flex items-center gap-1.5">
                                <i class="fa-regular fa-user"></i>
                                <span class="font-medium text-slate-500">${escapeHtml(p.author)}</span>
                            </div>
                            <div class="flex items-center gap-3">
                                <span>${p.date}</span>
                                ${p.link ? `<a href="${p.link}" target="_blank" class="text-indigo-600 hover:underline font-semibold flex items-center gap-1"><i class="fa-solid fa-link text-xs"></i> 웹링크</a>` : ''}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function getCategoryBadgeColor(cat) {
            switch (cat) {
                case '수업/기술': return 'bg-blue-50 text-blue-600 border border-blue-100';
                case '취업/취준': return 'bg-emerald-50 text-emerald-600 border border-emerald-100';
                case '자격증/시험': return 'bg-amber-50 text-amber-600 border border-amber-100';
                default: return 'bg-slate-100 text-slate-600 border border-slate-200';
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === cat) {
                    btn.className = 'tab-btn active px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-indigo-600 text-white';
                } else {
                    btn.className = 'tab-btn px-4 py-2 rounded-lg text-sm font-medium transition-colors bg-slate-100 text-slate-600 hover:bg-slate-200';
                }
            });
            renderPosts();
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderPosts();
        }

        function openModal() {
            document.getElementById('uploadModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('postForm').reset();
        }

        function savePost(e) {
            e.preventDefault();
            const category = document.getElementById('postCategory').value;
            const title = document.getElementById('postTitle').value;
            const author = document.getElementById('postAuthor').value;
            const content = document.getElementById('postContent').value;
            const link = document.getElementById('postLink').value;
            const fileInput = document.getElementById('postFile');

            const file = fileInput.files[0];

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    addPostAndSave(category, title, author, content, link, file.name, event.target.result);
                };
                reader.readAsDataURL(file);
            } else {
                addPostAndSave(category, title, author, content, link, '', '');
            }
        }

        function addPostAndSave(category, title, author, content, link, fileName, fileData) {
            const posts = getPosts();
            const newPost = {
                id: Date.now(),
                category,
                title,
                author,
                content,
                link,
                fileName,
                fileData,
                date: new Date().toISOString().split('T')[0]
            };

            posts.unshift(newPost);
            try {
                localStorage.setItem('info_community_posts', JSON.stringify(posts));
            } catch(e) {
                alert('파일 용량이 브라우저 저장 한도를 초과했습니다. 더 작은 파일을 사용해주세요.');
            }

            closeModal();
            renderPosts();
        }

        function deletePost(id) {
            if (confirm('이 자료 게시글을 삭제하시겠습니까?')) {
                let posts = getPosts();
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('info_community_posts', JSON.stringify(posts));
                renderPosts();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // Initialize on Load
        document.addEventListener('DOMContentLoaded', renderPosts);
    </script>
</body>
</html>
